[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "aegis-audit"
dynamic = ["version"]
description = "Dependency vulnerability scanner for lock files, powered by OSV.dev"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "packaging>=23.0",
    "pydantic>=2.6,<3",
    "pyyaml>=6.0",
    "rich>=13.7",
    "semver>=3.0",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML",
]
edit = ["ruamel.yaml>=0.18"]

[project.scripts]
aegis = "aegis.cli:app"

[tool.hatch.version]
path = "src/aegis/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/aegis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S108"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["rich", "rich.*", "ruamel", "ruamel.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "aegis.cli"
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = "typer"
ignore_missing_imports = true
